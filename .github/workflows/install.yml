name: Install paths

# Runs the real installers the way a user would: PowerShell 5.1 on Windows, install.sh inside
# the actual Bazzite image (plus a Quadlet dry-run with Bazzite's Podman), and the container image.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows installer (PowerShell 5.1, Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.13", explicit: false }   # let install.ps1 find Python itself (py launcher / PATH)
          - { python: "3.14", explicit: true }    # pass -Python explicitly
    steps:
      - name: Use a throw-away HomeMesh data folder
        shell: powershell
        run: Add-Content -Path $env:GITHUB_ENV -Value "HOMEMESH_HOME=$env:RUNNER_TEMP\hm-win"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install.ps1 -AutoStart (as a user would run it)
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $extra = @()
          if ("${{ matrix.explicit }}" -eq "true") { $extra = @("-Python", (Get-Command python).Source) }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\install.ps1 -AutoStart @extra
          if ($LASTEXITCODE) { throw "install.ps1 failed with exit code $LASTEXITCODE" }
      - name: Installed command, PATH, autostart entry, setup, start, web UI, chat, stop
        shell: powershell
        run: |
          $hm = "$env:LOCALAPPDATA\Programs\HomeMesh\bin\homemesh.cmd"
          $py = "$env:LOCALAPPDATA\Programs\HomeMesh\venv\Scripts\python.exe"
          if (-not ((Get-ItemProperty HKCU:\Environment).Path -like "*Programs\HomeMesh\bin*")) { throw "user PATH was not updated" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).HomeMesh
          if ($run -notlike "*pythonw.exe*-m homemesh run*") { throw "autostart entry missing or wrong: $run" }
          & $hm version; if ($LASTEXITCODE) { throw "homemesh version failed" }
          "correct-horse-battery" | & $hm setup --mode standalone --non-interactive --username owner --password-stdin --mock --no-service --port 18951
          if ($LASTEXITCODE) { throw "setup failed" }
          & $hm start; if ($LASTEXITCODE) { throw "start failed" }
          & $hm status; if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { throw "not running after start ($LASTEXITCODE)" }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18951/
          if ($page.Content -notmatch '<div id="root">') { throw "web UI not served" }
          & $py scripts\bench.py --runs 2 --model mock-chat; if ($LASTEXITCODE) { throw "chat round-trip failed" }
      - name: install.ps1 -Upgrade while HomeMesh is running
        shell: powershell
        run: |
          $hm = "$env:LOCALAPPDATA\Programs\HomeMesh\bin\homemesh.cmd"
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\install.ps1 -Upgrade
          if ($LASTEXITCODE) { throw "upgrade failed with exit code $LASTEXITCODE" }
          & $hm status; if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { throw "not running after upgrade ($LASTEXITCODE)" }
          & "$env:LOCALAPPDATA\Programs\HomeMesh\venv\Scripts\python.exe" scripts\bench.py --runs 1 --model mock-chat
          if ($LASTEXITCODE) { throw "chat after upgrade failed" }
          & $hm stop; if ($LASTEXITCODE) { throw "stop failed" }
          & $hm status; if ($LASTEXITCODE -ne 3) { throw "still running after stop ($LASTEXITCODE)" }
          exit 0  # status exit code 3 ("not running") is the expected result here
      - name: uninstall.ps1 keeps data
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\uninstall.ps1
          if ($LASTEXITCODE) { throw "uninstall failed with exit code $LASTEXITCODE" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\HomeMesh") { throw "program folder still present" }
          if ((Get-ItemProperty HKCU:\Environment).Path -like "*Programs\HomeMesh\bin*") { throw "PATH entry still present" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).HomeMesh) { throw "autostart entry still present" }
          if (-not (Test-Path "$env:HOMEMESH_HOME\data\homemesh.sqlite3")) { throw "data was removed" }
          "OK: Windows install lifecycle passed"

  bazzite:
    name: install.sh in the Bazzite image + Quadlet dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the large Bazzite image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /
      - name: Pull ghcr.io/ublue-os/bazzite-nvidia-open:stable
        run: docker pull ghcr.io/ublue-os/bazzite-nvidia-open:stable
      - name: Test inside Bazzite
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/ublue-os/bazzite-nvidia-open:stable bash /src/scripts/ci/bazzite_container_test.sh

  container:
    name: Container image build and run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compose files are valid
        run: docker compose -f deploy/containers/compose.yaml -f deploy/containers/compose.nvidia.yaml config -q
      - name: Build
        run: docker build -t localhost/homemesh:ci -f deploy/containers/Containerfile .
      - name: Run (mock backend), create owner, chat through the API, check health, user and UI
        run: |
          docker run -d --name hm -e HOMEMESH_MOCK=1 -e HOMEMESH__SERVER__HOST=0.0.0.0 \
            -e HOMEMESH__SERVER__ALLOW_INSECURE_LAN=true -p 127.0.0.1:8765:8765 -v hm-data:/data localhost/homemesh:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/api/v1/system/health && break; sleep 1; done
          echo "correct-horse-battery" | docker exec -i hm homemesh user create-owner --username owner --password-stdin
          docker cp scripts/bench.py hm:/tmp/bench.py
          docker exec hm python /tmp/bench.py --runs 2 --model mock-chat
          test "$(docker exec hm id -u)" = 1000
          curl -fsS http://127.0.0.1:8765/ | grep -q '<div id="root">'
          for i in $(seq 1 40); do s=$(docker inspect -f '{{.State.Health.Status}}' hm); [ "$s" = healthy ] && break; sleep 2; done
          echo "health: $s"; test "$s" = healthy
      - name: Logs on failure
        if: failure()
        run: docker logs hm || true
