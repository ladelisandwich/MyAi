name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.13" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" "ruff==0.17.*"
      - name: Lint
        if: matrix.python == '3.13' && runner.os == 'Linux'
        run: ruff check .
      - name: Unit and integration tests (mock inference only; no GPU or model needed)
        run: python -m pytest -q
      - name: CLI smoke check
        run: |
          homemesh version
          homemesh config validate
      - name: Lifecycle (setup, background start, chat via API, stop) with the labelled mock backend
        shell: bash
        env:
          HOMEMESH_HOME: ${{ runner.temp }}/hm-lifecycle
        run: |
          echo "correct-horse-battery" | homemesh setup --mode standalone --non-interactive --username owner \
            --password-stdin --mock --no-service --port 18923
          homemesh start
          homemesh status || test $? -eq 2     # 2 = running but degraded (no Ollama on CI runners)
          python scripts/bench.py --runs 2 --model mock-chat
          homemesh stop
          if homemesh status; then echo "still running after stop"; exit 1; fi

  web:
    name: Web client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
